name: Lint and Testing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint @ Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            **/go.sum
            go.tools.sum
      - name: Lint
        run: make lint

  test:
    name: test @ Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            **/go.sum
            go.tools.sum
      - name: Check formatting
        run: test -z "$(gofmt -l go)"
      - name: Vet
        run: make vet
      - name: Test with race detector and coverage
        run: make test
      - name: Build examples
        run: make build

  python-test:
    name: Python tests and Go/Python integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Install Python dependencies
        run: uv sync --project python --frozen
      - name: Lint Python
        run: |
          uv run --project python --frozen ruff check python tests scripts
          uv run --project python --frozen ruff format --check python tests scripts
      # The pytest fixtures build Go and exercise both implementations.
      - name: Test both languages with the local issuer
        run: uv run --project python --frozen pytest -q
      - name: Validate both Compose profiles (no live Signet needed)
        run: |
          cp .env.example .env
          SIGNET_ISSUER=https://issuer.example python3 scripts/configure_gateway.py
          docker compose --env-file .env -f labs/06/compose.yml --profile go config --quiet
          docker compose --env-file .env -f labs/06/compose.yml --profile python config --quiet
