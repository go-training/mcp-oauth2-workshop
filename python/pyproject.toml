[project]
name = "mcp-oauth2-workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "PyJWT[crypto]==2.14.0", "httpx==0.28.1", "uvicorn==0.41.0"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.5", "pyyaml==6.0.3"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["../tests"]
